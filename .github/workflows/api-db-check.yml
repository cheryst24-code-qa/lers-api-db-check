name: LERS API ↔ DB Consistency Check (MOCK DB)

on:
  schedule:
    - cron: "0 6 * * *" # каждый день в 8:00 UTC (11:00 МСК)
  push:
    branches: [main]
  workflow_dispatch: # запуск вручную из GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run API-DB Consistency Check (MOCK DB)
        id: run_tests
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_LOGIN: ${{ secrets.API_LOGIN }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          MOCK_DB: "true"
        run: |
          mkdir -p reports
          node index.js

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

          # === ОТПРАВКА УВЕДОМЛЕНИЯ В TELEGRAM ===
      - name: Send Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          # Определяем статус на основе исхода шага run_tests
          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
            MESSAGE="✅ Тесты HiTE PRO прошли успешно!"
          else
            RUN_URL="https://github.com/${GITHUB_REPO}/actions/runs/${GITHUB_RUN_ID}"
            STATUS="${{ steps.run_tests.outcome}}"
            MESSAGE="❌ Тесты HiTE PRO упали (статус: ${STATUS:-неизвестно})!\\nПодробности: $RUN_URL"
          fi

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=HTML"